name: Release skills

on:
  push:
    branches: [main]
    paths: ["skills/**"]
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Confirm every declared plugin has a complete root
        run: uv run skills/spawning-agent-plugins/scripts/check_plugin.py --root . --spec plugin.spec.json
      - name: Re-assemble every plugin and check for drift
        run: |
          if [ -d plugins ]; then
            for dir in plugins/*/; do
              skill=$(basename "$dir")
              uv run tools/assemble_plugin.py "$skill"
            done
          fi
          if [ -n "$(git status --porcelain plugins/)" ]; then
            echo "::error::Assembled plugin tree is out of sync with skills/ — run 'uv run tools/assemble_plugin.py <name>' and commit the result."
            git status --porcelain plugins/
            git diff plugins/
            exit 1
          fi

  release:
    needs: [drift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npx multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
